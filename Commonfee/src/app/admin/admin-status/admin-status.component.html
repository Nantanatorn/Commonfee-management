<app-admin-sidebar></app-admin-sidebar>
<div class="ad-page">
  <section class="ad-card status-card">
    <h2 class="ad-card-title">ระบบติดตามลูกหนี้</h2>

    <div class="ad-table-wrap">
      <table class="ad-table status-table">
        <thead>
          <tr>
            <th>บ้านเลขที่</th>
            <th>เจ้าของ</th>
            <th>ขนาดบ้าน</th>
            <th>จำนวนเงิน</th>
            <th>สถานะการชำระเงิน</th>
            <th>ปรับสถานะ</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let house of houses">
            <td>{{ house.houseNumber }}</td>
            <td>{{ house.ownerName }}</td>
            <td>{{ house.size }}</td>
            <td class="ad-num">{{ house.feetotal }}</td>
            <td>
              <span class="ad-badge" [class.ok]="house.isPaid" [class.bad]="!house.isPaid">
                {{ house.isPaid ? 'ชำระแล้ว' : 'ค้างชำระ' }}
              </span>
            </td>
            <td>
              <button class="ad-btn ad-btn-sm" (click)="togglePaymentStatus(house)">เปลี่ยนสถานะ</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<p class="home-note">home works!</p>
<div class="hero">
  <img class="hero-img" src="home.jpg">
  <div class="hero-copy">
      <h1>Welcome to BanDee</h1>
      <p>...</p>
  </div>
</div>
<div class="container news">
    <h2>ข่าวสาร&nbsp;<i class="bi bi-megaphone"></i></h2>
    <hr />
    <div class="row">
      <h1 class="information">ประกาศ <i class="bi bi-exclamation-lg inf" ></i></h1>
        <div class="col-12">

            <div class="col-12 notice-wrap" *ngFor="let Announce of Announcements | async">
                <div class="notice">
                  <div class="row g-0">
                    <div class="col-md-4">
                      <img [src]="'http://localhost:3500/' + Announce.Announce_image" class="img-fluid rounded-start" alt="{{ Announce.Announce_Title }}">
                    </div>
                    <div class="col-md-8">
                      <div class="card-body d-flex flex-column justify-content-center">
                        <p class="card-text"><small class="text-muted">{{ Announce.Adjusted_Announce_Date | date: 'MM/dd/yyyy, hh:mm a'}}</small></p>
                        <h5 class="card-title">{{ Announce.Announce_Title }}</h5>
                        <p class="card-text">{{ Announce.Announce_Detail }}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
        </div>
    </div>
</div>

<div class="form-container">
    <form [formGroup]="changePassForm" (ngSubmit)="onChange()">
        <h3>เปลี่ยนรหัสผ่าน</h3>
        <hr>

        <div class="request-row">
            <div class="input-field">
                <span class="bi bi-person-fill fs-4">&nbsp;</span>
                <input
                    type="text"
                    id="identifier"
                    formControlName="identifier"
                    placeholder="ชื่อผู้ใช้หรืออีเมล"
                    maxlength="50"
                    required
                    class="box"
                />
            </div>

            <button type="button" class="btn btn-alt" (click)="requestCode()">ขอรหัสยืนยันทางอีเมล</button>
        </div>

        <div class="input-field">
            <span class="bi bi-key-fill fs-4">&nbsp;</span>
            <input
                type="text"
                id="code"
                formControlName="code"
                placeholder="รหัสยืนยัน 6 หลัก"
                maxlength="6"
                inputmode="numeric"
                required
                class="box"
            />
        </div>

        <div class="input-field">
            <span class="bi bi-shield-lock-fill fs-4">&nbsp;</span>
            <input
                [type]="type"
                id="password"
                formControlName="password"
                placeholder="รหัสผ่านใหม่"
                maxlength="50"
                required
                class="box"
            />
            <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
        </div>

        <div class="input-field">
            <span class="bi bi-shield-lock-fill fs-4">&nbsp;</span>
            <input
                [type]="type"
                id="confirmPassword"
                formControlName="confirmPassword"
                placeholder="ยืนยันรหัสผ่านใหม่"
                maxlength="50"
                required
                class="box"
            />
            <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
            <div *ngIf="changePassForm.hasError('notSame') && changePassForm.get('confirmPassword')?.touched" class="error">
                รหัสผ่านไม่ตรงกัน กรุณายืนยันใหม่
            </div>
        </div>

        <button type="submit" class="btn">เปลี่ยนรหัสผ่าน</button>
    </form>
</div>
